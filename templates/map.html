<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Путь наблюдателя{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #e2c044;
            --dark: #16213e;
            --muted: #8a8578;
            --bg: #0f1115;
        }
        body {
            background-color: var(--bg);
            color: #c0b8a8;
            font-family: 'Inter', sans-serif;
        }
        .navbar-custom {
            background: rgba(22, 33, 62, 0.95);
            border-bottom: 1px solid rgba(226, 192, 68, 0.1);
        }
        .navbar-brand {
            color: var(--accent) !important;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .nav-link { color: #b0a898; }
        .nav-link:hover { color: var(--accent); }
        main { padding-top: 40px; padding-bottom: 60px; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/">🔦 Путь наблюдателя</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="/about/">О проекте</a></li>
                <li class="nav-item"><a class="nav-link" href="/map/">Карта пути</a></li>
                <li class="nav-item"><a class="nav-link" href="/courses/">Курсы</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="mt-5 text-center" style="color: #6a6558; font-size: 0.85rem;">
    &copy; 2026 Путь наблюдателя. Фонарь освещает путь.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
